name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with: { dotnet-version: 8.0.x }
      - name: Testovi pomoćnih funkcija
        run: dotnet test tests/Ductura.Core.Tests --configuration Release
      - name: Objava aplikacije
        run: dotnet publish src/Ductura.Desktop -c Release -r win-x64 --self-contained true -o publish
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Izrada instalacijskog paketa
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DSourceDir=..\publish installer\Ductura.iss'
      - name: Funkcionalni test (instalacija i pokretanje iz izbornika Start)
        run: ./tests/functional/Install-And-Launch.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: Ductura-Setup-x64, path: dist/Ductura-Setup-x64.exe }

  # Node tests on Linux: ci-ok itself (DAN-885) and the contract client
  # script (DAN-958); build-test stays as it is.
  ci-ok-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the YAML parser (package-lock.json, no scripts)
        run: npm ci --ignore-scripts
      - name: ci-ok tests
        run: node --test scripts/ci-ok.test.mjs scripts/contract-client.test.mjs

  # The C# contract client (DAN-958) must equal a fresh Kiota generation from
  # the locked @ductura/contracts release (downloaded from github.com, so an
  # outage there turns ci-ok red); the last step proves the check can fail.
  contract-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with: { dotnet-version: 8.0.x }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Restore Kiota (.config/dotnet-tools.json)
        run: dotnet tool restore
      - name: Generated code equals the locked OpenAPI
        run: node scripts/contract-client.mjs check
      - name: Generated code compiles (packages.lock.json, warnings are errors)
        run: |
          dotnet restore src/Ductura.Contracts --locked-mode
          dotnet build src/Ductura.Contracts --configuration Release --no-restore -warnaserror
      - name: Self-test, a changed generated file or a changed contract fails the check
        shell: bash
        run: |
          echo '// changed' >> src/Ductura.Contracts/Generated/DucturaApiClient.cs
          if node scripts/contract-client.mjs check; then echo "::error::check passed on changed code"; exit 1; fi
          git checkout -- src/Ductura.Contracts/Generated
          v="$(jq -r .version src/Ductura.Contracts/contract-lock.json)"
          curl -fsSL "https://github.com/ductura/server/releases/download/contracts-v$v/ductura-contracts-$v.tgz" | tar -xzO package/openapi/v1.json \
            | jq '.paths["/api/v1/health"].get.responses["200"].content["application/json"].schema.properties.minClientVersion.description = "changed"' > "$RUNNER_TEMP/changed.json"
          if node scripts/contract-client.mjs check "$RUNNER_TEMP/changed.json"; then echo "::error::check passed on a changed contract"; exit 1; fi

  # Secret scan and dependency review are the shared ductura/.github
  # workflows (DAN-879), called by full SHA; there is no tag yet.
  secret-scan:
    uses: ductura/.github/.github/workflows/secret-scan.yml@6f392fc2c87b1473266378d94895f1273087297c # main 2026-11-16

  dependency-review:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ductura/.github/.github/workflows/dependency-review.yml@6f392fc2c87b1473266378d94895f1273087297c # main 2026-11-16

  # The one required status (DAN-885): green only when every job above
  # succeeded; failure, cancelled, a missing result or a skip not listed in
  # ALLOW_SKIPPED fails it. The block is a copy of ductura/.github ci-ok.yml.
  # A plain job, so the check is named exactly ci-ok.
  ci-ok:
    name: ci-ok
    if: ${{ always() }}
    needs: [build-test, ci-ok-test, contract-client, secret-scan, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every needed job succeeded
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
          # dependency-review runs only on pull requests; there it must not be skipped.
          ALLOW_SKIPPED: ${{ github.event_name != 'pull_request' && 'dependency-review' || '' }}
        run: |
          # ci-ok:begin
          set -euo pipefail
          if ! jq -e 'type == "object" and length > 0' >/dev/null 2>&1 <<< "$RESULTS"; then
            echo "::error::results must be a non-empty JSON object; pass toJSON(needs) from a job with needs"
            exit 1
          fi
          allowed="$(tr -s ' \t\r\n' '\n' <<< "$ALLOW_SKIPPED" | sed '/^$/d' | jq -R . | jq -sc .)"
          problems="$(jq -r --argjson allowed "$allowed" '
            (($allowed - keys) | map("allow-skipped names a job that is not in needs: \(.)"))
            + (to_entries | map(
                ((.value | objects | .result) // "missing") as $r
                | if $r == "success" then empty
                  elif $r == "skipped" and (.key as $k | $allowed | index($k)) then empty
                  else "job \(.key) result: \($r)" end))
            | .[]' <<< "$RESULTS")"
          if [ -n "$problems" ]; then
            while IFS= read -r line; do echo "::error::$line"; done <<< "$problems"
            exit 1
          fi
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          echo "ci-ok: $(jq length <<< "$RESULTS") job(s) passed"
          # ci-ok:end
